<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0B0F;font-family:'Space Grotesk',system-ui,sans-serif;color:#F5F5F0;overflow-x:hidden}
.d{font-family:'Unbounded',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.mqbox{background:#D7FF3A;color:#0B0B0F;overflow:hidden;white-space:nowrap;border-bottom:3px solid #0B0B0F}
.mq{display:flex;width:max-content;animation:mq 90s linear infinite}
.mq span{font:800 13px 'Unbounded',sans-serif;padding:12px 28px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq{animation:none}}
header .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:20px}
.logo{font-size:26px;font-weight:900;letter-spacing:-.03em;text-decoration:none;color:#F5F5F0}
nav{display:flex;flex-wrap:wrap;gap:20px;font-weight:700}
a{color:#D7FF3A}a:hover{color:#FF6BD6}nav a{text-decoration:none}
.hero{display:flex;flex-wrap:wrap;gap:40px;padding-top:40px;padding-bottom:56px}
.hero>div{flex:1 1 380px;min-width:0}
h1{margin:0;font-size:clamp(48px,9vw,128px);line-height:.92;font-weight:900;letter-spacing:-.05em}
.lead{font-size:21px;line-height:1.5;color:#C9C9D2;max-width:560px;margin:24px 0}
.hot{background:#FF6BD6;color:#0B0B0F;border:3px solid #F5F5F0;border-radius:28px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;box-shadow:10px 10px 0 #D7FF3A;min-height:380px;text-decoration:none}
.hot:hover{color:#0B0B0F}
.hot .t{font-size:clamp(24px,3.2vw,38px);line-height:1.15;font-weight:900;letter-spacing:-.02em}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font:700 12px 'Space Grotesk',sans-serif;color:#0B0B0F;letter-spacing:.04em;text-transform:uppercase}
.tag.k{background:#0B0B0F;color:#F5F5F0}
.btn{font:800 16px 'Unbounded',sans-serif;min-height:56px;padding:0 32px;border:3px solid #0B0B0F;background:#D7FF3A;color:#0B0B0F;border-radius:14px;cursor:pointer;box-shadow:5px 5px 0 #FF6BD6;display:inline-flex;align-items:center;text-decoration:none}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #FF6BD6;color:#0B0B0F}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px}
input.s{flex:1 1 320px;min-height:52px;background:#15151b;border:2px solid #F5F5F0;border-radius:14px;color:#F5F5F0;font:600 17px 'Space Grotesk',sans-serif;padding:0 18px}
input.s:focus{outline:3px solid #D7FF3A}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.chip{font:700 14px 'Space Grotesk',sans-serif;min-height:44px;padding:0 18px;border:2px solid #F5F5F0;background:transparent;color:#F5F5F0;cursor:pointer;border-radius:999px}
.chip:hover{background:#26262e}.chip.on{background:#D7FF3A;color:#0B0B0F;border-color:#D7FF3A}
.cnt{font:600 15px 'Unbounded',sans-serif;color:#A8A8B3;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#15151b;border:2px solid #2c2c36;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:#F5F5F0;transition:transform .2s,border-color .2s}
.card:hover{transform:translate(-4px,-4px);border-color:#D7FF3A;box-shadow:6px 6px 0 #D7FF3A;color:#F5F5F0}
.card h2{margin:0;font-size:22px;line-height:1.3;font-weight:700}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font:600 13px 'Unbounded',sans-serif;color:#A8A8B3}
.card .m{margin-top:auto;font-size:14px;color:#A8A8B3;font-weight:600}
.more{text-align:center;padding:32px 0 40px}
footer{border-top:3px solid #D7FF3A;margin-top:24px;padding:48px 0;background:#15151b}
footer .wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-end}
.big{font-size:clamp(32px,6vw,72px);font-weight:900;letter-spacing:-.04em;line-height:1}
.t0{background:#D7FF3A}.t1{background:#FF6BD6}.t2{background:#5CE1FF}.t3{background:#7DF0A6}.t4{background:#FFB347}.t5{background:#B79CFF}.t6{background:#FF8A8A}.t7{background:#9BE7FF}.t8{background:#FFE066}.t9{background:#C4F000}.t10{background:#FFA7E7}.t11{background:#8CF5D2}.t12{background:#E0B3FF}
</style>
</head>
<body>
<div class="mqbox" aria-hidden="true"><div class="mq" id="mq"></div></div>
<header><div class="wrap">
<a class="logo d" href="/">near<span style="color:#D7FF3A">adin</span><span style="color:#FF6BD6">.net</span></a>
<nav aria-label="Ana menü"><a href="#liste">Başlıklar</a><a href="#kategoriler">Kategoriler</a><a href="#alt">Hakkında</a></nav>
</div></header>
<main>
<section class="wrap hero">
<div style="display:flex;flex-direction:column;justify-content:center">
<span class="tag t1" style="align-self:flex-start" id="durum">Canlı akış</span>
<h1 class="d" style="margin-top:24px">NE<br>ARARSAN<br><span style="color:#D7FF3A">ADIN</span><span style="color:#FF6BD6">!</span></h1>
<p class="lead">Haber, teknoloji, sağlık, yaşam, spor, yemek ve daha fazlası. Türkiye’nin gündemi tek sayfada, sürekli akıyor.</p>
<div><a href="#liste" class="btn">Akışa dal ↓</a></div>
</div>
<a class="hot" id="hero" href="#liste"><span class="tag k" id="hCat"></span><div class="t d" id="hTitle"></div><div style="font-weight:700;font-size:15px" id="hMeta"></div></a>
</section>
<section class="wrap" id="kategoriler">
<div class="bar"><input class="s" id="q" type="search" aria-label="Başlıklarda ara" placeholder="Başlıklarda ara: deprem, yapay zeka, dolar…"><button class="chip on" id="bNew">En yeni</button><button class="chip" id="bHot">Karışık</button></div>
<div class="chips" id="chips"></div>
</section>
<section class="wrap" id="liste">
<div class="cnt" id="cnt"></div>
<div class="grid" id="grid"></div>
<div class="more"><button class="btn" id="more">Daha fazla yükle (+24)</button></div>
</section>
</main>
<footer id="alt"><div class="wrap">
<div class="big d">near<span style="color:#D7FF3A">adin</span>.net</div>
<div style="color:#C9C9D2;font-size:16px;line-height:1.6;max-width:420px">Ne ararsan, adın burada. Başlıklar kaynaklarına bağlanır. © 2026 nearadin.net</div>
</div></footer>
<noscript><p class="wrap">Başlık akışını görmek için JavaScript gerekli.</p></noscript>
<script>
(function(){
var CATS=['Gündem','Ekonomi','Teknoloji','Sağlık','Yaşam','Spor','Magazin','Bilim','Otomobil','Eğitim','Yemek','Seyahat','Oyun'];
var SAMPLE={Gündem:['Asgari ücret','Kira artışı','Deprem hazırlığı','Toplu taşıma','Emeklilik düzenlemesi','Okul servisleri'],Ekonomi:['Dolar ve euro','Altın fiyatları','Borsa İstanbul','Enflasyon','Konut kredisi','Faiz kararı'],Teknoloji:['Yapay zeka','Yeni iPhone','Siber güvenlik','5G altyapısı','Akıllı saatler','Yerli çip üretimi'],Sağlık:['Uyku düzeni','Bağışıklık sistemi','Kalp sağlığı','D vitamini','Göz sağlığı','Su tüketimi'],Yaşam:['Ev dekorasyonu','Minimalist yaşam','Balkon bahçesi','Zaman yönetimi','Sabah rutini','Uzaktan çalışma'],Spor:['Süper Lig','Milli takım','Basketbol Ligi','Evde antrenman','Koşu programı','Transfer dönemi'],Magazin:['Dizi dünyası','Festival takvimi','Yeni albümler','Sinema vizyonu','Moda haftası','Sahne performansları'],Bilim:['Uzay görevleri','İklim değişikliği','Mars keşifleri','Kuantum bilgisayar','Gen düzenleme','Meteor yağmuru'],Otomobil:['Elektrikli otomobil','Hibrit modeller','Lastik bakımı','İkinci el piyasası','Yakıt tasarrufu','Kış sürüşü'],Eğitim:['YKS hazırlığı','Üniversite tercihleri','Online kurslar','Burs imkanları','Yabancı dil öğrenimi','Verimli ders çalışma'],Yemek:['Ev yapımı mantı','Zeytinyağlılar','Kahvaltı sofrası','Baklava','Fırın yemekleri','Sokak lezzetleri'],Seyahat:['Kapadokya','Ege koyları','Karadeniz yaylaları','Kamp alanları','Butik oteller','Hafta sonu kaçamakları'],Oyun:['Mobil oyunlar','E-spor turnuvaları','Konsol oyunları','Bağımsız yapımlar','Oyun bilgisayarı','Retro oyunlar']};
var TPL=[function(x,n){return x+' için uzmanlardan '+n+' pratik öneri'},function(x,n){return x+': bilmeniz gereken '+n+' şey'},function(x){return x+' rehberi: adım adım'}];
var all=[],cat='Tümü',q='',n=24,sort='new',live=false;
function sample(){var o=[],i=0,now=Date.now();TPL.forEach(function(t){CATS.forEach(function(c){SAMPLE[c].forEach(function(x){var h=(i*2654435761)%9973;o.push({baslik:t(x,(h%7)+3),kategori:c,link:'',kaynak:'',tarih:new Date(now-((h%55)+2)*60000).toISOString()});i++})})});return o}
function ago(iso){var m=Math.max(1,Math.round((Date.now()-new Date(iso))/60000));if(m<60)return m+' dk önce';if(m<1440)return Math.floor(m/60)+' sa önce';return Math.floor(m/1440)+' gün önce'}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function list(){var s=q.toLocaleLowerCase('tr');var l=all.filter(function(a){return(cat==='Tümü'||a.kategori===cat)&&(!s||a.baslik.toLocaleLowerCase('tr').indexOf(s)>-1)});l.sort(function(a,b){return sort==='new'?new Date(b.tarih)-new Date(a.tarih):(a.baslik<b.baslik?-1:1)});return l}
function render(){
var l=list(),g=document.getElementById('grid');g.textContent='';
l.slice(0,n).forEach(function(a,k){
var c=a.link?el('a','card'):el('article','card');if(a.link){c.href=a.link;c.target='_blank';c.rel='noopener nofollow'}
var top=el('div','top'),tg=el('span','tag t'+Math.max(0,CATS.indexOf(a.kategori)),a.kategori);top.appendChild(tg);top.appendChild(el('span','no','#'+String(k+1).padStart(3,'0')));
c.appendChild(top);c.appendChild(el('h2','',a.baslik));c.appendChild(el('div','m',ago(a.tarih)+(a.kaynak?' · '+a.kaynak:'')));g.appendChild(c)});
document.getElementById('cnt').textContent=Math.min(n,l.length)+' / '+l.length+' başlık'+(l.length?'':' — bu aramaya uyan başlık yok');
document.getElementById('more').style.display=l.length>n?'':'none';
var h=l[0];if(h){var he=document.getElementById('hero');if(h.link){he.href=h.link;he.target='_blank';he.rel='noopener nofollow'}document.getElementById('hCat').textContent='Günün manşeti · '+h.kategori;document.getElementById('hTitle').textContent=h.baslik;document.getElementById('hMeta').textContent=ago(h.tarih)+(h.kaynak?' · '+h.kaynak:'')}
var mq=document.getElementById('mq');mq.textContent='';all.slice(0,24).concat(all.slice(0,24)).forEach(function(a){mq.appendChild(el('span','','● '+a.kategori.toUpperCase()+': '+a.baslik))});
document.getElementById('durum').textContent=(live?'Canlı akış':'Örnek akış')+' · '+all.length+' başlık';
document.querySelectorAll('#chips .chip').forEach(function(b){b.className=b.textContent===cat?'chip on':'chip'});
document.getElementById('bNew').className=sort==='new'?'chip on':'chip';document.getElementById('bHot').className=sort==='new'?'chip':'chip on'}
function load(){fetch('haberler.json?v='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(d&&d.length){all=d;live=true;render()}}).catch(function(){})}
var ch=document.getElementById('chips');['Tümü'].concat(CATS).forEach(function(nm){var b=el('button','chip',nm);b.onclick=function(){cat=nm;n=24;render()};ch.appendChild(b)});
document.getElementById('q').oninput=function(e){q=e.target.value;n=24;render()};
document.getElementById('bNew').onclick=function(){sort='new';render()};
document.getElementById('bHot').onclick=function(){sort='abc';render()};
document.getElementById('more').onclick=function(){n+=24;render()};
all=sample();render();load();setInterval(load,300000);
})();
</script>
</body>
</html>
