name: Check Domain Category

on:
  push:
    branches: [ "main" ]
  schedule:
    # Her gün gece 00:00'da çalışmasını isterseniz (Opsiyonel)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu ekler

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Betiği Çalıştır
      env:
        XRANKS_API_KEY: ${{ secrets.XRANKS_API_KEY }}
      run: python main.py
