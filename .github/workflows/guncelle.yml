name: Haberleri güncelle
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "nearadin-bot"
          git config user.email "bot@nearadin.net"
          git add haberler.json
          git diff --staged --quiet || (git commit -m "Haberler güncellendi" && git push)
