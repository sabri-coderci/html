name: Haberleri Güncelle
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ana
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Değişiklik varsa commit et
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@nearadin.net"
          git add -A
          git diff --cached --quiet || (git commit -m "Otomatik haber güncellemesi" && git push origin ana)
