<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - nearadin.net</title>
    <!-- SEO Meta Etiketleri -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://nearadin.net/">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- ÜST BİLGİ & MARKA ALANI -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="/" class="text-2xl font-black text-indigo-400 tracking-wider flex items-center gap-1">
                <span>nearadin</span><span class="text-white bg-indigo-600 px-2 py-0.5 rounded-lg text-lg">.net</span>
            </a>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm transition shadow text-slate-200">
                ← Ana Sayfa
            </a>
        </div>
    </header>

    <!-- ANA İÇERİK ALANI (404 / YÖNLENDİRME) -->
    <main class="flex-grow max-w-3xl mx-auto px-4 py-16 w-full text-center space-y-8 flex flex-col justify-center items-center">
        
        <div class="space-y-3">
            <span class="text-indigo-400 font-black text-7xl md:text-8xl tracking-widest block opacity-80">404</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">Aradığınız Sayfa Bulunamadı</h1>
            <p class="text-slate-400 text-sm md:text-base max-w-md mx-auto">Aradığınız içerik taşınmış veya silinmiş olabilir. Ancak endişelenmeyin, aklınızdakini anında arayarak keşfedebilirsiniz.</p>
        </div>

        <!-- Akıllı Arama Kutusu (Doğrudan Detaylara Yönlendirir) -->
        <form onsubmit="hataAramaYonlendir(event)" class="w-full max-w-xl flex relative shadow-2xl">
            <input type="text" id="hataAramaGirdisi" placeholder="Ne aramak istemiştiniz?..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-l-2xl px-5 py-4 text-slate-100 focus:outline-none focus:border-indigo-500 transition text-sm md:text-base">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-8 rounded-r-2xl font-semibold transition flex items-center justify-center text-sm md:text-base shadow-lg">
                Ara
            </button>
        </form>

        <!-- Popüler Hızlı Yönlendirme Önerileri -->
        <div class="pt-6 w-full max-w-xl text-left bg-slate-800/60 p-6 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Gündemden Öne Çıkan Başlıklar</h3>
            <div id="hizliOneriler" class="flex flex-wrap gap-2 pt-1">
                <!-- JS ile dolacak -->
            </div>
        </div>

    </main>

    <!-- ALT BİLGİ -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 nearadin.net - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- JAVASCRIPT MİMARİSİ -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Eğer kullanıcı bozuk bir linkle geldiyse ve URL'de path kalıntısı varsa yakalayabiliriz
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 0) {
                const sonKelime = pathSegments[pathSegments.length - 1].replace(/[-_]/g, ' ');
                if (sonKelime && sonKelime !== '404.html') {
                    document.getElementById('hataAramaGirdisi').value = decodeURIComponent(sonKelime);
                }
            }

            hizliOnerileriDoldur();
        });

        function hizliOnerileriDoldur() {
            const container = document.getElementById('hizliOneriler');
            const trendler = [
                "Yapay Zeka Araçları", "Python ile Veri Analizi", "React 19 Yenilikleri", 
                "Gram Altın Piyasası", "Uzaktan Çalışma", "Siber Güvenlik"
            ];
            
            container.innerHTML = trendler.map(t => `
                <a href="/detaylar/?q=${encodeURIComponent(t)}" class="bg-slate-900 hover:bg-indigo-950 border border-slate-700/80 hover:border-indigo-500/50 text-xs px-3 py-2 rounded-xl text-slate-300 hover:text-white transition shadow-sm">
                    ${t}
                </a>
            `).join('');
        }

        function hataAramaYonlendir(event) {
            event.preventDefault();
            const val = document.getElementById('hataAramaGirdisi').value.trim();
            if (val) {
                window.location.href = `/detaylar/?q=${encodeURIComponent(val)}`;
            }
        }
    </script>
</body>
</html>
