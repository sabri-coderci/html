<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="sayfaBaslik">Arama Sonuçları - nearadin.net</title>
    <meta name="description" content="nearadin.net ile aradığınız sorguya ait gerçek sonuçlara anında ulaşın.">
    <meta name="robots" content="index, follow">
    <link id="canonicalUrl" rel="canonical" href="https://nearadin.net/detaylar/">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- ÜST BİLGİ & MARKA ALANI -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="/" class="text-2xl font-black text-indigo-400 tracking-wider flex items-center gap-1">
                <span>nearadin</span><span class="text-white bg-indigo-600 px-2 py-0.5 rounded-lg text-lg">.net</span>
            </a>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm transition shadow text-slate-200">
                ← Ana Sayfa
            </a>
        </div>
    </header>

    <!-- ANA İÇERİK ALANI -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">nearadin.net / arama sonuçları</span>
                <h1 id="detayAnaBaslik" class="text-2xl md:text-3xl font-black mt-1 text-white">Arama Sonuçları</h1>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Google CSE Resmi Arama ve Sonuç Bileşeni (Tetikleme Sorunu Olmayan Tam Entegrasyon) -->
            <article class="lg:col-span-2 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/60 shadow-lg space-y-4">
                <div class="gcse-search"></div>
            </article>

            <!-- Sağ Menü / Gündemden Öne Çıkanlar -->
            <aside class="space-y-6">
                <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-lg">
                    <h3 class="font-bold text-indigo-400 mb-3 text-base">Gündemden Öne Çıkanlar</h3>
                    <ul id="yanMenuTrendler" class="space-y-2.5 text-sm text-slate-300">
                        <!-- JS ile dolacak -->
                    </ul>
                </div>
            </aside>
        </div>
    </main>

    <!-- ALT BİLGİ -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 nearadin.net - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Google CSE Resmi Scripti -->
    <script async src="https://cse.google.com/cse.js?cx=a33464712b4234607"></script>

    <!-- JAVASCRIPT MİMARİSİ -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const sorgu = params.get('q');

            if (sorgu) {
                const temizSorgu = decodeURIComponent(sorgu).trim();
                document.getElementById('detayAnaBaslik').innerText = `"${temizSorgu}" Arama Sonuçları`;
                document.getElementById('sayfaBaslik').innerText = `${temizSorgu} - nearadin.net`;
                document.getElementById('canonicalUrl').setAttribute('href', `https://nearadin.net/detaylar/?q=${encodeURIComponent(temizSorgu)}`);

                // Google CSE tam bileşeni yüklendiğinde arama kutusunu doldurup tetiklemesi için güvenli döngü
                gseAramaCalistir(temizSorgu, 0);
            }

            yanMenuDoldur();
        });

        function gseAramaCalistir(sorgu, deneme) {
            const inputElement = document.querySelector('input.gsc-input');
            if (inputElement) {
                inputElement.value = sorgu;
                inputElement.dispatchEvent(new Event('input', { bubbles: true }));
                const searchButton = document.querySelector('button.gsc-search-button, input.gsc-search-button');
                if (searchButton) {
                    searchButton.click();
                }
            } else if (deneme < 20) {
                setTimeout(() => gseAramaCalistir(sorgu, deneme + 1), 300);
            }
        }

        function yanMenuDoldur() {
            const yanMenu = document.getElementById('yanMenuTrendler');
            const trendler = [
                "Yapay Zeka Araçları", "Python ile Veri Analizi", "React 19 Yenilikleri", 
                "Gram Altın Piyasası", "Uzaktan Çalışma Trendleri", "Siber Güvenlik Rehberi"
            ];
            
            yanMenu.innerHTML = trendler.map(t => `
                <li onclick="window.location.href='?q=${encodeURIComponent(t)}'" class="hover:text-indigo-400 cursor-pointer transition flex items-center gap-2">
                    <span class="text-indigo-500">▸</span> ${t}
                </li>
            `).join('');
        }
    </script>
</body>
</html>
