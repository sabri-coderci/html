<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="sayfaBaslik">Detaylar - nearadin.net</title>
    <!-- SEO Meta Etiketleri -->
    <meta name="description" content="nearadin.net detay sayfaları ile aradığınız sorguya ait Google arama sonuçlarına ve güncel içeriklere ulaşın.">
    <meta name="robots" content="index, follow">
    <link id="canonicalUrl" rel="canonical" href="https://nearadin.net/detaylar/">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- ÜST BİLGİ & MENÜ -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="/" class="text-2xl font-black text-indigo-400 tracking-wider">
                nearadin<span class="text-white">.net</span>
            </a>
            <!-- ARAMA FORMU -->
            <form onsubmit="detayAramaYap(event)" class="flex w-full md:w-1/2 relative">
                <input type="text" id="detayAramaGirdisi" placeholder="Başka bir şey arayın..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-l-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 rounded-r-xl font-semibold transition flex items-center justify-center">
                    Ara
                </button>
            </form>
        </div>
    </header>

    <!-- ANA İÇERİK ALANI -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="space-y-8">
            <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div>
                    <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">nearadin.net / detaylar</span>
                    <h1 id="detayAnaBaslik" class="text-3xl font-black mt-1">Arama Sonuçları</h1>
                </div>
                <a href="/" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">
                    ← Ana Sayfaya Dön
                </a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Google Arama Sonuçları -->
                <article class="lg:col-span-2 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/60 space-y-4">
                    <div class="gcse-searchresults-only"></div>
                </article>

                <!-- Yan Menü -->
                <aside class="space-y-6">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                        <h3 class="font-bold text-indigo-400 mb-3">Hızlı Kategoriler</h3>
                        <ul class="space-y-2 text-sm text-slate-300">
                            <li class="hover:text-indigo-400 cursor-pointer" onclick="kategoriyeGit('Teknoloji')">• Teknoloji</li>
                            <li class="hover:text-indigo-400 cursor-pointer" onclick="kategoriyeGit('Yazilim')">• Yazılım & Kod</li>
                            <li class="hover:text-indigo-400 cursor-pointer" onclick="kategoriyeGit('Yapay Zeka')">• Yapay Zeka</li>
                            <li class="hover:text-indigo-400 cursor-pointer" onclick="kategoriyeGit('Kariyer')">• Kariyer</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- ÖNİZLEME MODALI -->
    <div id="onizlemeModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-5xl h-[85vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-800 px-6 py-4 flex items-center justify-between border-b border-slate-700">
                <span id="modalBaslik" class="text-sm font-semibold text-slate-200 truncate max-w-md">Önizleme</span>
                <div class="flex items-center space-x-3">
                    <a id="modalDisaridanAc" href="#" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Yeni Sekmede Aç ↗</a>
                    <button onclick="modalKapat()" class="bg-rose-600 text-white w-8 h-8 rounded-lg font-bold">✕</button>
                </div>
            </div>
            <div class="flex-grow relative bg-slate-950">
                <div id="iframeYukleniyor" class="absolute inset-0 flex items-center justify-center bg-slate-900/90 z-10">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
                </div>
                <iframe id="onizlemeIframe" src="" class="w-full h-full border-none" onload="iframeYuklendi()"></iframe>
            </div>
        </div>
    </div>

    <!-- ALT BİLGİ -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 nearadin.net - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Google CSE Resmi Scripti -->
    <script async src="https://cse.google.com/cse.js?cx=a33464712b4234607"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            sorguyuIsleVeGoster();

            // URL veya Hash değişimlerini dinle (Google CSE içi geçişler için)
            window.addEventListener('hashchange', sorguyuIsleVeGoster);

            // Tıklanan dış linkleri modal içinde açma
            document.addEventListener('click', function(e) {
                const link = e.target.closest('.gsc-result a.gs-title, .gs-webResult a.gs-title, .gsc-webResult a');
                if (link && link.href && !link.href.includes('javascript:void') && !link.href.includes('nearadin.net')) {
                    e.preventDefault();
                    modaliAc(link.href, link.innerText || "İçerik Önizlemesi");
                }
            });
        });

        function sorguyuIsleVeGoster() {
            let arananDeger = "";

            // 1. Önce standart ?q= parametresini kontrol et
            const params = new URLSearchParams(window.location.search);
            arananDeger = params.get('q');

            // 2. Eğer ?q yoksa veya Google CSE hash parametreleri eklediyse (#gsc.q=...) onu yakala
            if (!arananDeger && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
                arananDeger = hashParams.get('gsc.q');
            }

            if (arananDeger) {
                // Kodlanmış karakterleri decode et (Örn: Python%20ile... -> Python ile...)
                const temizSorgu = decodeURIComponent(arananDeger.replace(/\+/g, ' '));
                
                document.getElementById('detayAnaBaslik').innerText = `"${temizSorgu}" Arama Sonuçları`;
                document.getElementById('sayfaBaslik').innerText = `${temizSorgu} - Detaylar`;
                document.getElementById('detayAramaGirdisi').value = temizSorgu;

                // Google CSE input alanını doldurup aramayı tetikle (Scriptin yüklenme süresi düşünülerek kademeli kontrol)
                tekrarlaAramaAyarla(temizSorgu, 0);
            }
        }

        function tekrarlaAramaAyarla(sorgu, deneme) {
            const inputElement = document.querySelector('input.gsc-input');
            if (inputElement) {
                inputElement.value = sorgu;
                // Google arama inputunun tetiklenmesi için input event'i fırlat
                inputElement.dispatchEvent(new Event('input', { bubbles: true }));
                
                const searchButton = document.querySelector('button.gsc-search-button, input.gsc-search-button');
                if (searchButton) {
                    searchButton.click();
                }
            } else if (deneme < 10) {
                // Google scripti henüz yüklenmediyse 300ms sonra tekrar dene
                setTimeout(() => tekrarlaAramaAyarla(sorgu, deneme + 1), 300);
            }
        }

        function detayAramaYap(event) {
            event.preventDefault();
            const val = document.getElementById('detayAramaGirdisi').value.trim();
            if(val) {
                window.location.href = `?q=${encodeURIComponent(val)}`;
            }
        }

        function kategoriyeGit(kat) {
            window.location.href = `?q=${encodeURIComponent(kat)}`;
        }

        function modaliAc(url, baslik) {
            document.getElementById('modalBaslik').innerText = baslik;
            document.getElementById('modalDisaridanAc').href = url;
            document.getElementById('iframeYukleniyor').classList.remove('hidden');
            document.getElementById('onizlemeIframe').src = url;
            document.getElementById('onizlemeModal').classList.remove('hidden');
        }

        function iframeYuklendi() {
            document.getElementById('iframeYukleniyor').classList.add('hidden');
        }

        function modalKapat() {
            document.getElementById('onizlemeModal').classList.add('hidden');
            document.getElementById('onizlemeIframe').src = "";
        }
    </script>
</body>
</html>
