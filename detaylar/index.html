<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="sayfaBaslik">Arama Sonuçları - nearadin.net</title>
    <meta name="description" content="nearadin.net ile aradığınız sorguya ait en güncel sonuçları ve detayları anında keşfedin.">
    <meta name="robots" content="index, follow">
    <link id="canonicalUrl" rel="canonical" href="https://nearadin.net/detaylar/">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- ÜST BİLGİ & MARKA ALANI -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="/" class="text-2xl font-black text-indigo-400 tracking-wider flex items-center gap-1">
                <span>nearadin</span><span class="text-white bg-indigo-600 px-2 py-0.5 rounded-lg text-lg">.net</span>
            </a>
            <!-- Arama Formu -->
            <form onsubmit="detayAramaYap(event)" class="flex w-full md:w-1/2 relative">
                <input type="text" id="detayAramaGirdisi" placeholder="Başka bir arama yapın..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-l-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 rounded-r-xl font-semibold transition flex items-center justify-center">
                    Ara
                </button>
            </form>
        </div>
    </header>

    <!-- ANA İÇERİK ALANI -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="flex items-center justify-between bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-lg">
            <div>
                <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">nearadin.net / arama sonuçları</span>
                <h1 id="detayAnaBaslik" class="text-2xl md:text-3xl font-black mt-1 text-white">Yükleniyor...</h1>
            </div>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm transition shadow">
                ← Ana Sayfa
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Dinamik Sonuçlar Alanı (Hataya sebep olan harici yükleyiciler yerine doğrudan güvenli havuz) -->
            <article class="lg:col-span-2 space-y-4" id="sonucListesiKonteyner">
                <!-- JavaScript ile doldurulacak -->
            </article>

            <!-- Sağ Menü / Gündem Başlıkları -->
            <aside class="space-y-6">
                <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-lg">
                    <h3 class="font-bold text-indigo-400 mb-3 text-base">Gündemden Diğer Başlıklar</h3>
                    <ul id="yanMenuTrendler" class="space-y-2.5 text-sm text-slate-300">
                        <!-- JS ile dolacak -->
                    </ul>
                </div>
            </aside>
        </div>
    </main>

    <!-- ALT BİLGİ -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 nearadin.net - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- JAVASCRIPT MİMARİSİ -->
    <script>
        const aramaVeriTabani = {
            "react 19 yenilikleri": {
                baslik: "React 19 Yenilikleri ve Geliştirici Rehberi",
                ozet: "React 19 ile birlikte gelen Server Actions, yeni hook'lar (useActionState, useOptimistic) ve performans iyileştirmeleri hakkında kapsamlı inceleme.",
                kategori: "Yazılım & Teknoloji"
            },
            "yapay zeka araçları": {
                baslik: "2026'nın En Popüler Yapay Zeka Araçları",
                ozet: "Günlük iş akışınızı hızlandıracak, kod yazımından tasarım üretimine kadar en yenilikçi yapay zeka asistanları ve kullanım ipuçları.",
                kategori: "Teknoloji"
            },
            "python ile veri analizi": {
                baslik: "Python ile Veri Analizi ve Temel Kütüphaneler",
                ozet: "Pandas, NumPy ve Matplotlib kullanarak büyük verileri nasıl analiz edeceğinizi ve görselleştireceğinizi adım adım öğrenin.",
                kategori: "Yazılım & Eğitim"
            },
            "gram altın piyasası": {
                baslik: "Gram Altın Fiyatları ve Uzman Yorumları",
                ozet: "Piyasalardaki son durum, döviz kurlarındaki hareketlilik ve altın yatırımcıları için güncel analiz raporları.",
                kategori: "Finans"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const sorgu = params.get('q');

            if (sorgu) {
                const temizSorgu = decodeURIComponent(sorgu).trim();
                document.getElementById('detayAnaBaslik').innerText = `"${temizSorgu}" Arama Sonuçları`;
                document.getElementById('sayfaBaslik').innerText = `${temizSorgu} - nearadin.net`;
                document.getElementById('detayAramaGirdisi').value = temizSorgu;
                document.getElementById('canonicalUrl').setAttribute('href', `https://nearadin.net/detaylar/?q=${encodeURIComponent(temizSorgu)}`);

                sonuclariGoster(temizSorgu);
            } else {
                document.getElementById('detayAnaBaslik').innerText = "Arama Yapılmadı";
                document.getElementById('sonucListesiKonteyner').innerHTML = `
                    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 text-center">
                        <p class="text-slate-400">Lütfen üstteki arama çubuğunu kullanarak veya ana sayfadan bir başlık seçerek arama yapın.</p>
                    </div>`;
            }

            yanMenuDoldur();
        });

        function sonuclariGoster(sorgu) {
            const container = document.getElementById('sonucListesiKonteyner');
            const key = sorgu.toLowerCase();
            
            // Eğer özel veri tabanında varsa detaylı göster, yoksa dinamik arama motoru kartı üret
            let sonucData = aramaVeriTabani[key] || {
                baslik: `${sorgu} Hakkında Kapsamlı Bilgi ve Detaylar`,
                ozet: `${sorgu} konusu, günümüz dijital dünyasında ve arama trendlerinde en çok merak edilen başlıklar arasında yer almaktadır. nearadin.net altyapısıyla derlenen güncel kaynaklar ve rehber niteliğindeki bilgiler aşağıdadır.`,
                kategori: "Genel Keşif"
            };

            container.innerHTML = `
                <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/80 shadow-lg space-y-3">
                    <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">${sonucData.kategori}</span>
                    <h2 class="text-xl font-bold text-white hover:text-indigo-300 transition cursor-pointer">${sonucData.baslik}</h2>
                    <p class="text-slate-300 text-sm leading-relaxed">${sonucData.ozet}</p>
                    <div class="pt-2 flex items-center gap-2 text-xs text-indigo-400">
                        <span>✓ nearadin.net Doğrulanmış İçerik</span>
                        <span>•</span>
                        <span>Güncel Arşiv</span>
                    </div>
                </div>
                <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/80 shadow-lg space-y-3">
                    <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">İlgili Bağlantılar ve Kaynaklar</span>
                    <h3 class="text-lg font-bold text-white">${sorgu} İle İlgili En Sık Sorulan Sorular</h3>
                    <p class="text-slate-300 text-sm leading-relaxed">Bu arama terimiyle ilgilenen kullanıcılarımızın incelediği alt başlıkları ve pratik ipuçlarını keşfedin.</p>
                </div>
            `;
        }

        function yanMenuDoldur() {
            const yanMenu = document.getElementById('yanMenuTrendler');
            const trendler = [
                "Yapay Zeka Araçları", "Python ile Veri Analizi", "React 19 Yenilikleri", 
                "Gram Altın Piyasası", "Uzaktan Çalışma Trendleri", "Siber Güvenlik Rehberi"
            ];
            
            yanMenu.innerHTML = trendler.map(t => `
                <li onclick="window.location.href='?q=${encodeURIComponent(t)}'" class="hover:text-indigo-400 cursor-pointer transition flex items-center gap-2">
                    <span class="text-indigo-500">▸</span> ${t}
                </li>
            `).join('');
        }

        function detayAramaYap(event) {
            event.preventDefault();
            const val = document.getElementById('detayAramaGirdisi').value.trim();
            if (val) {
                window.location.href = `?q=${encodeURIComponent(val)}`;
            }
        }
    </script>
</body>
</html>
